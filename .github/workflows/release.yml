# A tag v<version> publishes that version: to GitHub Packages and JitPack every
# time, and to Maven Central once its secrets exist (PUBLISHING.md). A release on
# Maven Central is permanent, so its deployment waits in the Central Portal for a
# person to press Publish.
name: Release

on:
  push:
    tags: ['v*']
  # For a tag released before Maven Central's secrets existed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish to Maven Central
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Build and test the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: The tag names the version the build declares
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          declared="$(./gradlew -q :vast-core:properties --property version | sed -n 's/^version: //p')"
          if [ "$TAG" != "v$declared" ]; then
            echo "::error::The tag is $TAG but the build declares $declared."
            exit 1
          fi
      - run: ./gradlew build

  github-packages:
    name: GitHub Packages
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

  jitpack:
    name: JitPack
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The first request for an artifact is what starts JitPack's build, and it
      # answers once the build is done.
      - name: Build the tag on JitPack
        env:
          BASE: https://jitpack.io/com/github/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 1200 "$BASE/vast-core/$TAG/vast-core-$TAG.pom")
          curl -s --max-time 60 "$BASE/$TAG/build.log" | tail -60
          if [ "$status" != 200 ]; then
            echo "::error::JitPack answered $status for vast-core $TAG."
            exit 1
          fi

  maven-central:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Maven Central's secrets
        id: secrets
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Maven Central skipped: its secrets are not set yet. PUBLISHING.md says how."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.secrets.outputs.ready == 'true'
      - name: Upload to the Central Portal
        if: steps.secrets.outputs.ready == 'true'
        run: ./gradlew publishToMavenCentral

  github-release:
    name: GitHub release
    needs: [github-packages, jitpack]
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
